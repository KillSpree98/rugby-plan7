<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Sin maximum-scale: bloquear el zoom impedía ampliar el texto (accesibilidad) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="description" content="Plan de definición, explosividad y ritmo de juego para pilar de rugby.">
<title>Plan Pilar</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan Pilar">
<script>
// Aplica el tema guardado antes de pintar para evitar el parpadeo oscuro -> claro
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('rp_settings_v1') || '{}');
    var colors = { oscuro: '#14161a', contraste: '#000000', claro: '#f4f1ea' };
    if (s.theme && colors[s.theme]) {
      document.documentElement.setAttribute('data-theme', s.theme);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', colors[s.theme]);
    }
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">
  <div class="topbar-title">PLAN <span>PILAR</span></div>
  <div class="topbar-right">
    <div class="topbar-sub" id="topbar-sub"></div>
    <button id="help-btn" class="theme-btn" type="button" aria-label="Ayuda y guía">?</button>
    <button id="theme-btn" class="theme-btn" type="button" aria-label="Cambiar tema">🌙</button>
  </div>
</div>

<div id="app"></div>
<nav id="nav" aria-label="Secciones"></nav>
<noscript>Esta app necesita JavaScript.</noscript>

<script src="js/data.js"></script>
<script src="js/guide.js"></script>
<script src="js/app.js"></script>
</body>
</html>
